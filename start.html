<body>

        <img src="uk.png" class="flag" onclick="setLang('en')">

    <!-- 🔥 BACK BUTTON -->
    <button class="shadow__btn blue back-btn" onclick="goBack()" data-lang="back">

    <!-- 🔥 SMOKE -->
    <div class="smoke">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- 🔥 CONTENT -->
    <div class="container">
        <p class="subtitle" data-lang="startText">
            Brzy tu něco bude...
        </p>
    </div>

    <!-- SCRIPT -->
    <script src="script.js"></script>

    <!-- 🔥 FORCE LANGUAGE LOAD -->
    <script>
        const savedLang = localStorage.getItem("lang") || "cz";
        setLang(savedLang);
    </script>

</body>
