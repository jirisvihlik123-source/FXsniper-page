<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>FXsniper</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 🇨🇿 🇬🇧 -->
    <div class="lang-switch">
        <img src="cz.png" class="flag" onclick="setLang('cz')">
        <img src="uk.png" class="flag" onclick="setLang('en')">
    </div>

    <!-- TELEGRAM -->
    <div class="telegram-wrapper" onclick="goTelegram()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="telegram-icon">
        <span class="telegram-text">PŘIDEJ SE</span>
    </div>

    <!-- SMOKE -->
    <div class="smoke">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- SNAP SCROLL -->
    <div class="scroll-container">

        <section class="section">
            <h1 class="title">FXSNIPER</h1>
            <p class="text">Automatický Forex bot analyzující trh v reálném čase.</p>
        </section>

        <section class="section">
            <h1 class="title">PRECISION</h1>
            <p class="text">Pouze kvalitní vstupy. Žádné zbytečné trady.</p>
        </section>

        <section class="section">
            <h1 class="title">PERFORMANCE</h1>
            <p class="text">Statistiky, winrate a kontrolovaný risk management.</p>
        </section>

        <section class="section">
            <h1 class="title">JOIN FXSNIPER</h1>

            <button class="shadow__btn blue" onclick="goTelegram()">
                Připoj se
            </button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
