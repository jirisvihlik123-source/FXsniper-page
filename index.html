<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>FXsniper</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 🇨🇿 🇬🇧 -->
    <div class="lang-switch">
        <img src="cz.png" class="flag" onclick="setLang('cz')">
        <img src="uk.png" class="flag" onclick="setLang('en')">
    </div>

    <!-- TELEGRAM -->
    <div class="telegram-wrapper" onclick="goTelegram()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="telegram-icon">
        <span class="telegram-text" data-lang="joinTop">PŘIDEJ SE</span>
    </div>

    <!-- SMOKE -->
    <div class="smoke">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- SNAP SCROLL -->
    <div class="scroll-container">

        <!-- 1 -->
        <section class="section">
            <h1 class="title" data-lang="main">FXSNIPER</h1>
            <p class="text" data-lang="desc">
                Automatický Forex bot analyzující trh v reálném čase.
            </p>
        </section>

        <!-- 2 -->
        <section class="section">
            <h1 class="title" data-lang="precision">PRECISION</h1>
            <p class="text" data-lang="precisionText">
                Pouze kvalitní vstupy. Žádné zbytečné trady.
            </p>
        </section>

        <!-- 3 -->
        <section class="section">
            <h1 class="title" data-lang="performance">PERFORMANCE</h1>
            <p class="text" data-lang="performanceText">
                Statistiky, winrate a kontrolovaný risk management.
            </p>
        </section>

        <!-- 4 (NOVÁ POSLEDNÍ SEKCE) -->
        <section class="section">
            <h1 class="title" data-lang="welcome">Vítejte v FXsniper</h1>

            <button class="shadow__btn blue" onclick="goStart()" data-lang="startBtn">
                Start
            </button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
